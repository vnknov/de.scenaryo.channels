services:
  channels-mcp:
    build: .
    init: true
    ports:
      - "${CHANNELS_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      CONFIG_DIR: /app/config
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
